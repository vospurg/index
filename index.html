<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="https://gnlab.com/cdn/tachyons.min.css">
<link rel="stylesheet" href="https://gnlab.com/cdn/animate.min.css">
<script src="https://gnlab.com/cdn/vue.global.prod.min.js"></script>
<script id="vendor-chart" type="text/plain" data-src="https://gnlab.com/cdn/chart.umd.min.js"></script>


<style id="base-shell-style">
html, body { height: 100%; min-height: 100%; }
body { margin: 0; width: 100%; }
/* 关键：撑满视口 + 不依赖 100vw，避免塌陷 */
#app {
width: 100%;
min-height: 100dvh;
min-height: 100vh;
display: flex;
flex-direction: column;
}
</style>


<title>今日鼓励卡</title>
<style>
:root { color-scheme: light; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background-color: #f6f4ef;
  background-image:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.85), rgba(255,255,255,0) 38%),
    repeating-linear-gradient(135deg, rgba(80, 69, 50, .06) 0, rgba(80, 69, 50, .06) 2px, transparent 2px, transparent 10px);
}
.focus-ring:focus-visible,
button:focus-visible,
input:focus-visible {
  outline: 3px solid #137752;
  outline-offset: 2px;
}
.toast {
  position: fixed;
  left: 50%;
  bottom: 1rem;
  transform: translateX(-50%);
  max-width: 92%;
  z-index: 9;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>
<body>
<div id="app" class="flex flex-column w-100"><section class="flex-none ph3 ph4-ns pt4 pb3 tc">
  <p class="ttu tracked f7 dark-green b ma0">每天 10 秒，给自己一点光</p>
  <h1 class="ma0 mt2 f2 f1-ns lh-title dark-gray animate__animated animate__fadeInDown">今日鼓励卡 ✨</h1>
</section>

<main class="flex-auto overflow-auto ph3 ph4-ns pb6">
  <div class="center mw6 bg-white-80 br3 pa3 pa4-ns shadow-2 animate__animated animate__fadeInUp">
    <label for="name" class="db f6 b dark-gray mb2">称呼（可选）</label>
    <input
      id="name"
      v-model.trim="name"
      class="focus-ring input-reset ba b--black-20 br2 w-100 pa3 mb3 bg-white"
      type="text"
      maxlength="12"
      placeholder="例如：小林"
      @keydown.enter.prevent="handlePrimary"
    >

    <p class="f6 mb3" :class="helperTone">{{ helperText }}</p>

    <div class="flex items-center">
      <button
        class="focus-ring bn br2 bg-dark-green white b ph4 pv3 mr2"
        style="min-height:44px"
        :disabled="!canGenerate"
        :aria-disabled="!canGenerate"
        @click="generateCard"
        @keydown.space.prevent="generateCard"
      >生成鼓励语</button>
      <button
        class="focus-ring bn br2 bg-near-white dark-gray ph3 pv3"
        style="min-height:44px"
        @click="resetAll"
      >清空</button>
    </div>

    <div class="mt4" role="status" aria-live="polite">
      <p v-if="isLoading" class="ma0 dark-green">正在书写你的卡片…</p>
      <div v-else-if="errorMsg" class="pa3 br2 bg-washed-red dark-red">{{ errorMsg }}</div>
      <div v-else-if="!cardText" class="pa3 br2 bg-near-white dark-gray">还没有生成内容，点击上方按钮开始。</div>
      <article v-else class="pa3 pa4-ns br3 bg-washed-green dark-gray">
        <p class="ma0 f5 lh-copy">{{ cardText }}</p>
      </article>
    </div>
  </div>
</main>

<section class="flex-none ph3 pb4 tc dark-gray">
  <small>按 Enter 可快速触发，按 Esc 可关闭提示。</small>
</section>

<div v-if="toast.show" class="toast">
  <div class="br2 bg-dark-gray white ph3 pv2">{{ toast.text }}</div>
</div></div>


<script>
// APP_SCRIPT
const { createApp, ref, reactive, computed, watch, onMounted, onBeforeUnmount, nextTick } = Vue;

const vendorState = new Map();
function loadVendor(id) {
  const holder = document.getElementById(id);
  if (!holder) return Promise.reject(new Error(`未找到占位脚本: ${id}`));
  const src = holder.dataset && holder.dataset.src;
  if (!src) return Promise.reject(new Error(`占位脚本缺少 data-src: ${id}`));
  if (vendorState.has(id)) return vendorState.get(id);
  const found = document.querySelector(`script[src="${src}"]`);
  if (found) {
    const ready = Promise.resolve(window.Chart || true);
    vendorState.set(id, ready);
    return ready;
  }
  const p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve(window.Chart || true);
    s.onerror = () => reject(new Error(`加载失败: ${src}`));
    document.head.appendChild(s);
  });
  vendorState.set(id, p);
  return p;
}

createApp({
  setup() {
    const title = '今日鼓励卡';
    document.title = title;

    const name = ref('');
    const isLoading = ref(true);
    const cardText = ref('');
    const errorMsg = ref('');
    const toast = reactive({ show: false, text: '' });
    let loadingTimer = null;
    let toastTimer = null;

    const canGenerate = computed(() => !isLoading.value && name.value.length <= 12);
    const helperText = computed(() => {
      if (name.value.length > 12) return '称呼最多 12 个字。';
      return name.value ? `将为「${name.value}」生成一句鼓励。` : '不填称呼也可以生成。';
    });
    const helperTone = computed(() => (name.value.length > 12 ? 'f6 mb3 dark-red' : 'f6 mb3 gray'));

    function showToast(text) {
      toast.text = text;
      toast.show = true;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.show = false; }, 1800);
    }

    function generateCard() {
      if (isLoading.value) return;
      if (name.value.length > 12) {
        errorMsg.value = '称呼太长，请缩短后再试。';
        showToast('请先修正输入');
        return;
      }
      errorMsg.value = '';
      const starter = name.value ? `${name.value}，` : '你，';
      const options = [
        `${starter}今天也在慢慢变好，哪怕一步，也算前进。`,
        `${starter}你已经很努力了，请把温柔也留给自己。`,
        `${starter}别急，花会沿路开，答案会在路上来。`
      ];
      cardText.value = options[Math.floor(Math.random() * options.length)];
      showToast('已生成今日卡片');
      nextTick(() => {
        const main = document.querySelector('main');
        if (main) main.scrollTop = main.scrollHeight;
      });
    }

    function resetAll() {
      name.value = '';
      cardText.value = '';
      errorMsg.value = '';
      showToast('已清空');
    }

    function handlePrimary() {
      if (canGenerate.value) generateCard();
    }

    function onEsc(e) {
      if (e.key === 'Escape') toast.show = false;
    }

    watch(name, () => {
      if (errorMsg.value) errorMsg.value = '';
    });

    onMounted(() => {
      loadingTimer = setTimeout(() => { isLoading.value = false; }, 520);
      window.addEventListener('keydown', onEsc);
    });

    onBeforeUnmount(() => {
      clearTimeout(loadingTimer);
      clearTimeout(toastTimer);
      window.removeEventListener('keydown', onEsc);
    });

    return {
      name,
      isLoading,
      cardText,
      errorMsg,
      toast,
      canGenerate,
      helperText,
      helperTone,
      generateCard,
      resetAll,
      handlePrimary
    };
  }
}).mount('#app');
</script>
</body>
</html>
